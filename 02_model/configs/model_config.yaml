model:
  name: RetinaNet-FPN-CBAM
  backbone_pretrained: True
  use_cbam: True
  fpn_out_channels: 256
  num_classes: 1

anchors:
  base_size: 16
  ratios: [0.5, 1, 2]
  scales: [1.0, 1.2599, 1.5874]  # emphasize small scales; equivalent to 2**0, 2**(1/3), 2**(2/3)

training:
  image_size: 512
  batch_size: 8
  lr: 1e-3
  weight_decay: 1e-4
  optimizer: adamw
  scheduler: cosine
